<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Georgia, 'Times New Roman', serif">
  <!-- Zone profile of region III, Sturmzinnen (proposal 2026-11-13). Scale: 1 km = 520 px, north up. Names are working titles.
       Lies in the north-east of the open world: x = (world Y - 2600 m) * 0.52, y = (4900 m - world X) * 0.52.
       Weather by corruption (Boris 2026-11-13): calm when pure, storm, snow and blizzard the more corrupted; the Hörner are winter. -->
  <defs>
    <radialGradient id="sea" cx="40%" cy="55%" r="85%">
      <stop offset="0" stop-color="#26323b"/>
      <stop offset="1" stop-color="#0d1216"/>
    </radialGradient>
    <filter id="coast" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#3f7fa8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1c2a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb3d0"/>
      <stop offset="0.35" stop-color="#6d7d88"/>
      <stop offset="0.65" stop-color="#5a5f7a"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#sea)"/>

  <!-- Region II: the tail tip of the Wurzelforst (Schwanzgrat, Die Fänge) comes in from the west -->
  <path d="M0 520 C40 530 70 548 92 566 C80 600 40 612 0 612 Z" fill="#3c4a3a" opacity="0.9" filter="url(#coast)"/>
  <text x="14" y="505" font-size="13" fill="#9fd08e">Schwanzspitze · Die Fänge (II)</text>

  <!-- Land: the head of the Urdrachin, lower jaw in the south, eye in the middle, two horns in the north-east -->
  <g filter="url(#coast)">
    <path d="M150 560 C190 470 280 410 400 380 C520 350 640 330 760 300 C860 270 930 200 1010 140 C1080 90 1170 70 1250 80 C1350 95 1440 140 1500 210 C1550 280 1560 380 1530 470 C1500 560 1440 640 1380 720 C1320 800 1230 870 1110 910 C980 950 820 960 680 950 C540 940 400 910 300 860 C210 815 150 740 135 660 C130 620 136 590 150 560 Z" fill="#3e4146"/>
    <g filter="url(#soft)">
      <ellipse cx="230" cy="620" rx="150" ry="120" fill="#4d5a60" opacity="0.95"/>
      <ellipse cx="560" cy="820" rx="330" ry="130" fill="#4f4a52" opacity="0.95"/>
      <ellipse cx="1000" cy="520" rx="260" ry="200" fill="#55606c" opacity="0.95"/>
      <ellipse cx="1250" cy="230" rx="270" ry="170" fill="#c9d4de" opacity="0.85"/>
      <ellipse cx="1330" cy="600" rx="150" ry="170" fill="#6a7480" opacity="0.8"/>
    </g>
  </g>

  <!-- The two horns: ridges with glaciers -->
  <g fill="none" stroke="#eef4fa" stroke-linecap="round" opacity="0.85">
    <path d="M1060 250 C1110 190 1170 140 1230 70" stroke-width="16"/>
    <path d="M1260 300 C1330 240 1400 180 1470 120" stroke-width="16"/>
  </g>
  <g fill="#ffffff" opacity="0.25" filter="url(#glow)">
    <circle cx="1200" cy="120" r="40"/><circle cx="1440" cy="160" r="40"/>
  </g>

  <!-- The eye: a round crater lake, the academy on its rim -->
  <circle cx="990" cy="500" r="80" fill="url(#eye)"/>
  <circle cx="990" cy="500" r="48" fill="#2c5a76" stroke="#bfe6ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Teeth along the lower jaw -->
  <g fill="#cfc6b6" opacity="0.8">
    <path d="M300 868 l10 -34 l10 34 z"/><path d="M380 900 l10 -36 l10 36 z"/><path d="M470 922 l10 -36 l10 36 z"/>
    <path d="M570 936 l10 -38 l10 38 z"/><path d="M680 944 l10 -36 l10 36 z"/><path d="M790 942 l10 -34 l10 34 z"/>
  </g>

  <!-- Die Lücke: the gap between tail tip and mouth, shallows and a rope bridge over the strait -->
  <path d="M92 566 C110 572 128 576 150 578" stroke="#b9a77a" stroke-width="4" stroke-dasharray="3 5" fill="none"/>
  <text x="70" y="600" font-size="12" fill="#cdbfa3">Seilbrücke</text>

  <!-- Zone borders -->
  <g fill="none" stroke="#efe6d2" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 8">
    <path d="M360 400 C380 520 400 640 360 760"/>
    <path d="M360 760 C520 700 700 690 840 720 C920 740 1000 780 1080 870"/>
    <path d="M760 300 C800 380 820 460 840 560 C860 640 860 690 840 720"/>
    <path d="M840 560 C960 380 1080 330 1210 360 C1300 380 1380 420 1460 470"/>
  </g>

  <!-- Campaign path -->
  <path d="M0 566 C40 570 90 572 150 578 C240 590 300 640 380 700 C470 760 580 790 700 780 C790 770 860 720 900 640 C930 580 950 545 990 560 C1040 575 1080 520 1100 450 C1120 380 1160 320 1210 270 C1250 230 1290 190 1330 150" fill="none" stroke="#efe6d2" stroke-width="5" stroke-opacity="0.85"/>
  <!-- Side paths -->
  <g fill="none" stroke="#efe6d2" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.6">
    <path d="M700 780 C760 840 800 880 820 920"/>
    <path d="M990 560 C1100 620 1220 640 1330 610"/>
    <path d="M1330 610 C1400 680 1450 760 1500 860"/>
    <path d="M1210 270 C1300 260 1380 230 1440 170"/>
    <path d="M900 640 C860 560 820 460 800 380"/>
  </g>

  <!-- Camps (safe, fast travel) -->
  <g fill="#ffb066" stroke="#14171b" stroke-width="2">
    <rect x="198" y="604" width="16" height="16" transform="rotate(45 206 612)"/>
    <rect x="552" y="772" width="16" height="16" transform="rotate(45 560 780)"/>
    <rect x="1022" y="560" width="18" height="18" transform="rotate(45 1031 569)"/>
    <rect x="1182" y="300" width="16" height="16" transform="rotate(45 1190 308)"/>
  </g>
  <!-- Fighting clearings, 40 m -->
  <g fill="none" stroke="#efe6d2" stroke-opacity="0.55" stroke-width="2">
    <circle cx="300" cy="660" r="10"/><circle cx="440" cy="740" r="10"/><circle cx="640" cy="830" r="10"/><circle cx="780" cy="760" r="10"/>
    <circle cx="880" cy="690" r="10"/><circle cx="820" cy="420" r="10"/><circle cx="1140" cy="420" r="10"/><circle cx="1280" cy="560" r="10"/>
    <circle cx="1420" cy="760" r="10"/><circle cx="1150" cy="200" r="10"/><circle cx="1380" cy="210" r="10"/><circle cx="1280" cy="150" r="10"/>
  </g>
  <!-- Element sources -->
  <g stroke="#14171b" stroke-width="1.5">
    <circle cx="160" cy="560" r="6" fill="#8fd8ff"/><circle cx="520" cy="900" r="6" fill="#8fd8ff"/><circle cx="990" cy="500" r="7" fill="#8fd8ff"/>
    <circle cx="250" cy="600" r="6" fill="#d8eef0"/><circle cx="860" cy="330" r="6" fill="#d8eef0"/><circle cx="1240" cy="120" r="6" fill="#d8eef0"/><circle cx="1470" cy="250" r="6" fill="#d8eef0"/>
    <circle cx="720" cy="900" r="6" fill="#a08a64"/><circle cx="1350" cy="640" r="6" fill="#a08a64"/><circle cx="1110" cy="270" r="6" fill="#a08a64"/>
    <circle cx="1040" cy="580" r="6" fill="#ff7a2e"/><circle cx="1196" cy="318" r="6" fill="#ff7a2e"/>
  </g>
  <!-- Nid spring (sealed): the tear duct of the eye -->
  <circle cx="1080" cy="470" r="8" fill="#a24dff" stroke="#14171b" stroke-width="2"/>

  <!-- Labels -->
  <g font-size="14" fill="#efe6d2" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="222" y="616">Lückenwacht</text>
    <text x="576" y="770">Kliffhütte</text>
    <text x="1046" y="596">Akademie (Lager)</text>
    <text x="1206" y="300">Hornbiwak</text>
  </g>
  <g font-size="12" fill="#cdbfa3" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="160" y="545">Gischt und Nebel aus der Lücke</text>
    <text x="300" y="905">Zahnreihe</text>
    <text x="740" y="740">Wetterwarte</text>
    <text x="830" y="938">Blitzfeld (Blitzglas)</text>
    <text x="760" y="372">Seherturm des Ordens</text>
    <text x="910" y="460">Das Auge</text>
    <text x="1094" y="468">Tränenkanal · Nid-Quelle, versiegelt</text>
    <text x="1300" y="600">Archiv im Fels</text>
    <text x="1420" y="800">Frostspat-Bruch</text>
    <text x="1050" y="180">Horngletscher</text>
    <text x="1236" y="80">Eisfeld (Blutregen, Draculaupen)</text>
    <text x="1336" y="200">Doppeluhu-Horste</text>
    <text x="1340" y="140">Gipfel: Bossarena</text>
    <text x="1400" y="890">zum Nackenstieg (IV · Eisenschlund)</text>
    <text x="1320" y="640">Sturmglocken</text>
  </g>
  <g font-size="22" fill="#ffffff" font-weight="bold" stroke="#14171b" stroke-width="4" paint-order="stroke">
    <text x="190" y="700">1 · Die Lücke</text>
    <text x="470" y="870">2 · Kieferklippen</text>
    <text x="900" y="390">3 · Akademie am Auge</text>
    <text x="1080" y="250">4 · Hörner</text>
  </g>
  <g font-size="13" fill="#cdbfa3" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="190" y="720">Mundwinkel, Gischt · Übergang ohne Ladebildschirm</text>
    <text x="470" y="890">Küste, Regen und Gewitter</text>
    <text x="900" y="410">Stadt der Gelehrten · sicherer Hub</text>
    <text x="1080" y="270">Hochgebirge · Schnee, Blizzard · Boss</text>
  </g>

  <!-- Title -->
  <text x="40" y="60" font-size="38" font-weight="bold" fill="#efe6d2">III · Sturmzinnen</text>
  <text x="40" y="88" font-size="16" fill="#cdbfa3">Zonenprofil · Vorschlag 13. November 2026 · Namen sind Arbeitstitel</text>
  <text x="40" y="110" font-size="15" fill="#9d927c">Kopf der Urdrachin · etwa 2,4 km × 1,7 km · 4 Zonen zu je ~500 m · Kampagnenweg ~2,6 km</text>

  <!-- Weather by corruption -->
  <g transform="translate(40,140)">
    <rect width="560" height="200" rx="8" fill="#14171b" opacity="0.82"/>
    <text x="16" y="28" font-size="17" font-weight="bold" fill="#efe6d2">Wetter nach Verderbnis</text>
    <rect x="16" y="42" width="528" height="14" rx="7" fill="url(#ladder)"/>
    <g font-size="12" fill="#cdbfa3">
      <text x="16" y="74">0 %</text><text x="122" y="74">20</text><text x="228" y="74">40</text><text x="334" y="74">60</text><text x="440" y="74">80</text><text x="520" y="74">100</text>
    </g>
    <g font-size="12.5" fill="#efe6d2">
      <text x="16" y="96">0–20: klar, kalte Brise, ruhige See; oben leichter Schnee</text>
      <text x="16" y="116">20–40: Nebel und Regen an der Küste; oben Schneefall</text>
      <text x="16" y="136">40–60: Sturm mit Gewitter; oben Schneesturm, Kälte setzt zu</text>
      <text x="16" y="156">60–80: Eisregen und Hagel an der Küste; oben Blizzard, Sicht kurz</text>
      <text x="16" y="176">80–100: Blizzard überall, klirrende Kälte, Brandung friert an den Klippen</text>
    </g>
    <text x="16" y="194" font-size="11.5" fill="#9d927c">Höhe: in den Hörnern immer eine Stufe kälter und härter · Feuer und Lager wärmen</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,980)" font-size="13" fill="#cdbfa3">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#efe6d2" stroke-width="5"/><text x="50" y="5">Weg der Kampagne</text>
    <line x1="210" y1="0" x2="250" y2="0" stroke="#efe6d2" stroke-width="2.5" stroke-dasharray="8 6"/><text x="260" y="5">Nebenweg</text>
    <rect x="360" y="-7" width="13" height="13" transform="rotate(45 366 0)" fill="#ffb066"/><text x="384" y="5">Lager: sicher, Schnellreise</text>
    <circle cx="590" cy="0" r="9" fill="none" stroke="#efe6d2" stroke-opacity="0.6" stroke-width="2"/><text x="606" y="5">freie Kampffläche, 40 m</text>
    <circle cx="790" cy="0" r="6" fill="#ff7a2e"/><circle cx="806" cy="0" r="6" fill="#8fd8ff"/><circle cx="822" cy="0" r="6" fill="#a08a64"/><circle cx="838" cy="0" r="6" fill="#d8eef0"/>
    <text x="852" y="5">Elementquellen: Feuer, Wasser, Erde, Luft</text>
    <circle cx="1170" cy="0" r="7" fill="#a24dff"/><text x="1184" y="5">Nid-Quelle</text>
  </g>
  <g transform="translate(40,1040)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#efe6d2" stroke-width="3"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#efe6d2" stroke-width="3"/><line x1="260" y1="-6" x2="260" y2="6" stroke="#efe6d2" stroke-width="3"/>
    <text x="0" y="24" font-size="13" fill="#cdbfa3">500 m · gut 1 Minute Laufen</text>
  </g>
</svg>
