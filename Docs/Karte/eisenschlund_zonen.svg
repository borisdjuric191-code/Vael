<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Georgia, 'Times New Roman', serif">
  <!-- Zone profile of region IV, Eisenschlund (proposal 2026-11-13). Scale: 1 km = 440 px, north up. Names are working titles.
       Lies in the south-east of the open world, east of the Aschenmark, south of the Sturmzinnen:
       x = (world Y - 2550 m) * 0.44, y = (3000 m - world X) * 0.44. The ribs of the Urdrachin curve round the heart (north-west). -->
  <defs>
    <radialGradient id="sea" cx="55%" cy="55%" r="85%">
      <stop offset="0" stop-color="#262b30"/>
      <stop offset="1" stop-color="#0d1013"/>
    </radialGradient>
    <filter id="coast" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="heart" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#7a1a3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2a0f1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8f88"/>
      <stop offset="0.4" stop-color="#9a7a55"/>
      <stop offset="0.7" stop-color="#a0522d"/>
      <stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#sea)"/>

  <!-- Neighbours: the Aschenmark in the west (Schlackentor), the Sturmzinnen in the north (Nackenstieg) -->
  <path d="M0 640 C30 660 40 760 30 880 L0 900 Z" fill="#4a3f36" opacity="0.9" filter="url(#coast)"/>
  <text x="10" y="625" font-size="13" fill="#ffb066">Aschenmark (I)</text>
  <path d="M1300 0 L1560 0 C1540 40 1500 70 1440 80 C1380 70 1330 40 1300 0 Z" fill="#4a5058" opacity="0.9" filter="url(#coast)"/>
  <text x="1330" y="100" font-size="13" fill="#a9c4ee">Sturmzinnen (III)</text>

  <!-- The heart lies north-west inside the curl: the ribs bend round it -->
  <circle cx="140" cy="420" r="110" fill="url(#heart)"/>
  <text x="40" y="368" font-size="13" fill="#ffd2c8">zur Wunde (V · Das Herz)</text>

  <!-- Land: ribs and flank of the Urdrachin -->
  <g filter="url(#coast)">
    <path d="M30 700 C80 560 200 470 330 420 C470 360 600 300 720 250 C860 190 1000 150 1140 120 C1260 95 1360 90 1440 90 C1520 120 1560 220 1560 340 C1560 480 1530 620 1480 740 C1420 880 1300 980 1140 1030 C960 1080 760 1080 580 1060 C400 1040 230 990 120 920 C60 880 30 800 30 700 Z" fill="#3f3a36"/>
    <g filter="url(#soft)">
      <ellipse cx="1300" cy="250" rx="230" ry="170" fill="#545a60" opacity="0.95"/>
      <ellipse cx="820" cy="480" rx="420" ry="200" fill="#5a4a3e" opacity="0.95"/>
      <ellipse cx="620" cy="880" rx="430" ry="150" fill="#4e3a2c" opacity="0.95"/>
      <ellipse cx="1300" cy="780" rx="200" ry="170" fill="#4a4038" opacity="0.9"/>
    </g>
  </g>

  <!-- The rib arches: long ridges curving round the heart, with valleys between -->
  <g fill="none" stroke="#d8cfbf" stroke-linecap="round" opacity="0.75">
    <path d="M330 470 C520 380 760 330 980 330" stroke-width="18"/>
    <path d="M360 590 C560 500 820 450 1080 450" stroke-width="18"/>
    <path d="M420 710 C620 620 880 570 1160 580" stroke-width="18"/>
  </g>
  <!-- Arches where a rib stands free: one can walk under them -->
  <g fill="none" stroke="#efe6d2" stroke-width="3" stroke-opacity="0.8">
    <path d="M700 352 q20 -30 40 0"/><path d="M900 458 q20 -30 40 0"/><path d="M800 600 q20 -30 40 0"/>
  </g>

  <!-- Slag river from the smelters to the sea -->
  <path d="M520 860 C600 900 700 960 760 1050" stroke="#ff6a1a" stroke-width="9" fill="none" opacity="0.8"/>
  <path d="M520 860 C600 900 700 960 760 1050" stroke="#ffb066" stroke-width="20" fill="none" opacity="0.18" filter="url(#glow)"/>

  <!-- Zone borders -->
  <g fill="none" stroke="#efe6d2" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 8">
    <path d="M1060 120 C1080 220 1120 300 1200 360 C1290 420 1400 440 1540 430"/>
    <path d="M300 760 C500 760 700 740 900 730 C1060 720 1200 700 1420 680"/>
  </g>

  <!-- Campaign path: from the Sturmzinnen down the neck, through the ribs, to the mining town; the Schlackentor joins it -->
  <path d="M1440 90 C1420 160 1390 200 1350 240 C1310 280 1260 300 1220 340 C1170 390 1120 420 1060 460 C980 510 900 540 820 570 C740 600 660 640 610 700 C570 750 560 800 580 850" fill="none" stroke="#efe6d2" stroke-width="5" stroke-opacity="0.85"/>
  <path d="M30 790 C120 800 220 820 320 840 C420 860 500 860 580 850" fill="none" stroke="#efe6d2" stroke-width="5" stroke-opacity="0.85"/>
  <g fill="none" stroke="#efe6d2" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.6">
    <path d="M580 850 C700 840 820 860 960 900"/>
    <path d="M960 900 C1080 930 1200 900 1300 840"/>
    <path d="M820 570 C760 500 700 440 640 400"/>
    <path d="M1060 460 C1160 520 1260 560 1360 600"/>
    <path d="M610 700 C520 650 440 600 380 560"/>
    <path d="M330 470 C300 450 260 440 220 430"/>
  </g>

  <!-- Camps -->
  <g fill="#ffb066" stroke="#14171b" stroke-width="2">
    <rect x="102" y="794" width="16" height="16" transform="rotate(45 110 802)"/>
    <rect x="570" y="842" width="22" height="22" transform="rotate(45 581 853)"/>
    <rect x="862" y="548" width="16" height="16" transform="rotate(45 870 556)"/>
    <rect x="1312" y="232" width="16" height="16" transform="rotate(45 1320 240)"/>
  </g>
  <!-- Fighting clearings -->
  <g fill="none" stroke="#efe6d2" stroke-opacity="0.55" stroke-width="2">
    <circle cx="230" cy="830" r="9"/><circle cx="430" cy="860" r="9"/><circle cx="720" cy="620" r="9"/><circle cx="660" cy="520" r="9"/>
    <circle cx="960" cy="520" r="9"/><circle cx="1000" cy="400" r="9"/><circle cx="1160" cy="400" r="9"/><circle cx="1260" cy="300" r="9"/>
    <circle cx="1420" cy="200" r="9"/><circle cx="1080" cy="900" r="9"/><circle cx="1300" cy="620" r="9"/><circle cx="460" cy="560" r="9"/>
  </g>
  <!-- Element sources -->
  <g stroke="#14171b" stroke-width="1.5">
    <circle cx="560" cy="900" r="6" fill="#ff7a2e"/><circle cx="700" cy="980" r="6" fill="#ff7a2e"/><circle cx="1240" cy="860" r="6" fill="#ff7a2e"/>
    <circle cx="760" cy="400" r="6" fill="#a08a64"/><circle cx="1000" cy="560" r="6" fill="#a08a64"/><circle cx="1360" cy="600" r="6" fill="#a08a64"/><circle cx="820" cy="900" r="6" fill="#a08a64"/>
    <circle cx="880" cy="345" r="6" fill="#d8eef0"/><circle cx="1000" cy="465" r="6" fill="#d8eef0"/><circle cx="1400" cy="150" r="6" fill="#d8eef0"/>
    <circle cx="1060" cy="960" r="6" fill="#8fd8ff"/><circle cx="380" cy="560" r="6" fill="#8fd8ff"/>
  </g>
  <circle cx="290" cy="500" r="8" fill="#a24dff" stroke="#14171b" stroke-width="2"/>

  <!-- Labels -->
  <g font-size="14" fill="#efe6d2" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="128" y="790">Schlackentor-Posten</text>
    <text x="600" y="880">Grubenstadt der Gilde</text>
    <text x="886" y="552">Rippenlager</text>
    <text x="1336" y="236">Nackenhütte</text>
  </g>
  <g font-size="12" fill="#cdbfa3" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="36" y="770">Schlackentor (aus der Aschenmark)</text>
    <text x="440" y="960">Schmelzhütten</text>
    <text x="700" y="1045">Schlackenfluss</text>
    <text x="760" y="930">Förderturm, Hauptschacht</text>
    <text x="980" y="955">geflutete Stollen</text>
    <text x="1180" y="900">Kernerz-Stollen (tief)</text>
    <text x="1310" y="820">Funkenerz-Adern</text>
    <text x="640" y="380">Knochenhalle unter der Rippe</text>
    <text x="900" y="330">Windschlucht</text>
    <text x="1040" y="500">Rippenbrücke</text>
    <text x="1300" y="580">Salvenschwein-Suhlen</text>
    <text x="330" y="545">Rostschwamm-Höhle</text>
    <text x="440" y="660">Grubenlaternen</text>
    <text x="1180" y="170">Nackenwirbel</text>
    <text x="1380" y="300">Wachturm der Gilde</text>
    <text x="1430" y="60">vom Hornbiwak herab</text>
    <text x="150" y="528">Tiefster Schacht · Nid-Quelle, versiegelt</text>
    <text x="160" y="455">Sondierung zum Herzen</text>
  </g>
  <g font-size="22" fill="#ffffff" font-weight="bold" stroke="#14171b" stroke-width="4" paint-order="stroke">
    <text x="1180" y="400">1 · Nackenstieg</text>
    <text x="640" y="470">2 · Rippenbögen</text>
    <text x="300" y="1010">3 · Minen der Gilde</text>
  </g>
  <g font-size="13" fill="#cdbfa3" stroke="#14171b" stroke-width="3" paint-order="stroke">
    <text x="1180" y="420">steiler Abstieg vom Kopf, Serpentinen</text>
    <text x="640" y="490">Kämme und Täler zwischen den Rippen</text>
    <text x="300" y="1030">Stadt, Schächte, Schmelzen · Gilde, Twist</text>
  </g>

  <!-- Title -->
  <text x="40" y="60" font-size="38" font-weight="bold" fill="#efe6d2" transform="translate(560,0)">IV · Eisenschlund</text>
  <text x="600" y="88" font-size="16" fill="#cdbfa3">Zonenprofil · Vorschlag 13. November 2026 · Namen sind Arbeitstitel</text>
  <text x="600" y="110" font-size="15" fill="#9d927c">Rippen der Urdrachin · etwa 3,2 km × 2,3 km · 3 Zonen · Kampagnenweg ~3 km</text>

  <!-- Weather proposal -->
  <g transform="translate(30,130)">
    <rect width="620" height="196" rx="8" fill="#14171b" opacity="0.85"/>
    <text x="16" y="28" font-size="17" font-weight="bold" fill="#efe6d2">Wetter nach Verderbnis · Vorschlag</text>
    <rect x="16" y="42" width="588" height="14" rx="7" fill="url(#ladder)"/>
    <g font-size="12" fill="#cdbfa3">
      <text x="16" y="74">0 %</text><text x="134" y="74">20</text><text x="252" y="74">40</text><text x="370" y="74">60</text><text x="488" y="74">80</text><text x="580" y="74">100</text>
    </g>
    <g font-size="12.5" fill="#efe6d2">
      <text x="16" y="96">0–20: klar, Wind pfeift durch die Rippen</text>
      <text x="16" y="116">20–40: Staub und Rauch aus den Schmelzen, Sicht trüb</text>
      <text x="16" y="136">40–60: Glutregen bei den Schmelzen, Steinschlag an den Rippen</text>
      <text x="16" y="156">60–80: Rostregen (ätzt Rüstung), die Rippen beben</text>
      <text x="16" y="176">80–100: Beben und Glutsturm, Stollen stürzen ein</text>
    </g>
    <text x="16" y="192" font-size="11.5" fill="#9d927c">In den Minen kein Himmelswetter, dafür Grubengas und Wassereinbrüche</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,1060)" font-size="13" fill="#cdbfa3">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#efe6d2" stroke-width="5"/><text x="50" y="5">Weg der Kampagne</text>
    <line x1="210" y1="0" x2="250" y2="0" stroke="#efe6d2" stroke-width="2.5" stroke-dasharray="8 6"/><text x="260" y="5">Nebenweg</text>
    <rect x="360" y="-7" width="13" height="13" transform="rotate(45 366 0)" fill="#ffb066"/><text x="384" y="5">Lager: sicher, Schnellreise</text>
    <circle cx="590" cy="0" r="9" fill="none" stroke="#efe6d2" stroke-opacity="0.6" stroke-width="2"/><text x="606" y="5">freie Kampffläche, 40 m</text>
    <circle cx="790" cy="0" r="6" fill="#ff7a2e"/><circle cx="806" cy="0" r="6" fill="#8fd8ff"/><circle cx="822" cy="0" r="6" fill="#a08a64"/><circle cx="838" cy="0" r="6" fill="#d8eef0"/>
    <text x="852" y="5">Elementquellen: Feuer, Wasser, Erde, Luft</text>
    <circle cx="1170" cy="0" r="7" fill="#a24dff"/><text x="1184" y="5">Nid-Quelle</text>
    <line x1="1300" y1="0" x2="1520" y2="0" stroke="#efe6d2" stroke-width="3"/><text x="1300" y="22" font-size="12">500 m</text>
  </g>
</svg>
